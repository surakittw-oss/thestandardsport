<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE STANDARD SPORT</title>
  <!-- Access gate: run before anything paints, so a visitor with no
       verified session never sees a flash of the real page. Mirrors the
       same "no-flash" pattern used for dark-mode init on the WP plugin. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('tsdGate');
        var s = raw ? JSON.parse(raw) : null;
        var ok = s && typeof s.email === 'string' && s.exp > Date.now() &&
          s.email.toLowerCase().endsWith('@thestandard.co');
        if (!ok) document.documentElement.classList.add('tsd-locked');
      } catch (e) {
        document.documentElement.classList.add('tsd-locked');
      }
    })();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="icon" type="image/png" href="uploads/favicon.png">
  <link rel="apple-touch-icon" href="uploads/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Noto+Serif+Thai:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg:#ffffff; --bg-alt:#f6f6f6; --bg-card:#ffffff; --bg-row:#fafafa;
      --txt:#0d0d0d; --txt-2:#4a4a4a; --txt-3:#8a8a8a; --txt-4:#b8b8b8;
      --bdr:#e6e6e6; --bdr-2:#f1f1f1;
      --accent:#ffa5f7;      /* CI pink — headline chips, fills, rules */
      --on-accent:#0d0d0d;   /* text that sits on the CI pink */
      --accent-ink:#d81b8f;  /* deeper pink for small text on white */
      /* Soft lifted shadows (infographic card style) */
      --sh-1:0 1px 2px rgba(13,13,13,.05), 0 2px 8px rgba(13,13,13,.055);
      --sh-2:0 2px 6px rgba(13,13,13,.06), 0 10px 26px rgba(13,13,13,.08);
      --sh-hi:0 6px 14px rgba(13,13,13,.09), 0 18px 40px rgba(13,13,13,.11);
    }
    [data-theme="dark"] {
      --bg:#111111; --bg-alt:#181818; --bg-card:#1c1c1c; --bg-row:#202020;
      --txt:#efefef; --txt-2:#cccccc; --txt-3:#8a8a8a; --txt-4:#5a5a5a;
      --bdr:#2a2a2a; --bdr-2:#242424;
      --accent-ink:#ffa5f7;  /* pink reads well on dark — use it directly */
      --sh-1:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.35);
      --sh-2:0 2px 6px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.45);
      --sh-hi:0 6px 14px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.55);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: Sarabun, sans-serif; background: var(--bg); color: var(--txt); -webkit-font-smoothing: antialiased; transition: background .25s, color .25s; }
    button { cursor: pointer; }
    ::-webkit-scrollbar { width: 4px; background: var(--bg-alt); }
    ::-webkit-scrollbar-thumb { background: #ffa5f7; }

    /* ── Access gate ─────────────────────────────────────────────── */
    html.tsd-locked #root { display: none; }
    #tsd-gate { display: none; position: fixed; inset: 0; z-index: 999999; background: var(--bg);
      align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px; text-align: center; }
    html.tsd-locked #tsd-gate { display: flex; }
    /* The lockup is a white mark made for the black menu bar — it needs a
       dark plate behind it or it vanishes on the light gate background. */
    #tsd-gate-logo { background: #0d0d0d; padding: 16px 26px; margin-bottom: 4px; }
    #tsd-gate-logo img { height: 34px; width: auto; display: block; }
    #tsd-gate p { color: var(--txt-2); font-size: 14px; line-height: 1.6; max-width: 320px; }
    #tsd-gate-err { color: #d81b8f; font-size: 13px; display: none; max-width: 320px; }
    #tsd-logout { display: none; position: fixed; right: 14px; bottom: 14px; z-index: 999998;
      font-family: "Chakra Petch","Space Grotesk",sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; color: var(--txt-3); background: var(--bg-card);
      box-shadow: var(--sh-1); border: 1px solid var(--bdr); padding: 7px 12px; }
    html:not(.tsd-locked) #tsd-logout { display: block; }

    /* ── Motion ──────────────────────────────────────────────────── */
    /* 1. Cover zoom on hover — frame stays square, image moves inside */
    .zoom-frame { overflow:hidden; }
    .zoom-img   { position:absolute; inset:0; transition:transform .55s cubic-bezier(.2,.6,.2,1); will-change:transform; }
    .zoom-frame:hover .zoom-img, .news-item:hover .zoom-img, article:hover .zoom-img { transform:scale(1.07); }
    .news-item:hover h3, article:hover h2, article:hover h3 { color:var(--accent-ink); }
    .news-item h3, article h2, article h3 { transition:color .18s ease; }
    /* 2. Scroll reveal */
    .reveal     { opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s cubic-bezier(.2,.6,.2,1); }
    .reveal.in  { opacity:1; transform:none; }
    /* 3. Count-up numbers use JS only — no styles needed beyond tabular figures */
    [data-count] { font-variant-numeric:tabular-nums; }
    /* 4. Speed streak — one pink sweep across the hero on first load */
    .streak     { position:absolute; top:0; bottom:0; left:0; width:26%; z-index:2; pointer-events:none;
                  background:#ffa5f7; opacity:.85; transform:skewX(-18deg) translateX(-300%);
                  animation:fx-sweep 1.15s cubic-bezier(.7,0,.25,1) .15s forwards; }
    @keyframes fx-sweep { to { transform:skewX(-18deg) translateX(500%); } }
    /* Respect users who ask for less motion */
    @media (prefers-reduced-motion: reduce) {
      .zoom-img, .reveal { transition:none !important; }
      .zoom-frame:hover .zoom-img, .news-item:hover .zoom-img, article:hover .zoom-img { transform:none; }
      .reveal { opacity:1; transform:none; }
      .streak { display:none; }
      .ed-card { transition:none !important; }
    }

    /* ── Editorial system (label + hairline sections + display type) ─ */
    /* CI heading chip — pink block, dark text (same lockup as the SPORT logo) */
    .ed-label   { display:inline-block; background:var(--accent); color:var(--on-accent); font-family:"Chakra Petch","Space Grotesk",sans-serif; font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; padding:5px 12px; }
    .ed-tag     { font-family:"Chakra Petch","Space Grotesk",sans-serif; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--txt-3); border:1px solid var(--bdr); padding:3px 9px; white-space:nowrap; }
    .ed-head    { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:14px; margin-bottom:20px; border-bottom:2px solid var(--accent); }
    .ed-head-all { font-family:"Chakra Petch","Space Grotesk",sans-serif; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--txt-3); white-space:nowrap; text-decoration:none; }
    .ed-head-all:hover { color:var(--accent-ink); }
    .ed-rule    { width:56px; height:4px; background:var(--accent); }
    .ed-display { font-family:"Chakra Petch","Space Grotesk",sans-serif; font-weight:800; text-transform:uppercase; line-height:.9; letter-spacing:-.025em; color:var(--txt); }
    .ed-lede    { font-size:17px; line-height:1.65; color:var(--txt-2); }
    /* Cards are separated by soft shadow, not borders (infographic style) */
    .ed-card    { background:var(--bg-card); box-shadow:var(--sh-2); overflow:hidden; }
    /* Full-bleed hero: the cover fills the whole band, headline sits on top of it */
    .rsp-edhero    { position:relative; min-height:620px; display:flex; overflow:hidden; background:#0b0b0d; }
    .ed-hero-cover { position:absolute; inset:0; background-size:cover !important; background-position:center !important; }
    /* Bottom-weighted rather than a flat wash: a wash dark enough for the
       headline also buried the photograph, so the darkness is concentrated
       where the text sits and the top of the cover comes back. */
    .ed-hero-scrim { position:absolute; inset:0; background:
        linear-gradient(90deg, rgba(8,8,10,.78) 0%, rgba(8,8,10,.62) 32%, rgba(8,8,10,.28) 58%, rgba(8,8,10,.08) 100%),
        linear-gradient(180deg, rgba(8,8,10,.10) 0%, transparent 28%, rgba(8,8,10,.38) 58%, rgba(8,8,10,.76) 100%); }
    .ed-hero-text  { position:relative; z-index:1; display:flex; flex-direction:column; width:100%; max-width:1280px;
                     padding:34px 56px 44px max(40px, calc((100vw - 1280px)/2 + 40px)); }
    /* Hero copy always sits on the darkened cover, so it stays light in both themes */
    .ed-hero-text .ed-display { color:#fff; text-shadow:0 2px 28px rgba(0,0,0,.45); }
    .ed-hero-text .ed-lede    { color:rgba(255,255,255,.82); }
    .ed-hero-text .ed-tag     { color:rgba(255,255,255,.72); border-color:rgba(255,255,255,.32); }
    .ed-hero-note             { color:rgba(255,255,255,.6) !important; }
    .ed-hero-note span        { border-color:rgba(255,255,255,.4) !important; color:rgba(255,255,255,.6) !important; }
    .ed-hero-meta             { color:rgba(255,255,255,.55); }
    .ed-hero-meta b           { color:#ffa5f7; font-weight:600; }
    .ed-read { display:inline-flex; align-items:center; gap:10px; align-self:flex-start; margin-top:22px;
               padding:11px 18px; background:var(--accent); color:#0d0d0d; text-decoration:none;
               border:0; cursor:pointer;
               font-family:"Chakra Petch","Space Grotesk",sans-serif; font-size:11px; font-weight:800;
               letter-spacing:.08em; text-transform:uppercase; }
    .ed-read:hover { background:#fff; color:#0d0d0d; }
    @media (max-width:768px) {
      .rsp-edhero    { min-height:520px; }
      .ed-hero-scrim { background:linear-gradient(180deg, rgba(8,8,10,.58) 0%, rgba(8,8,10,.30) 32%, rgba(8,8,10,.55) 58%, rgba(8,8,10,.90) 100%); }
      .ed-hero-text  { padding:24px 16px 32px; }
    }
    /* ── Responsive layout ─────────────────────────────────────── */
    .rsp-wrap  { max-width:1280px; margin:0 auto; padding:0 40px; }
    /* One page, one rhythm — the WordPress .tsd-wrap-flow. Sections used to sit
       on alternating bands, which made each look like a separate widget. */
    .rsp-flow  { padding-top:44px; padding-bottom:44px; }
    .rsp-flow > *          { margin-top:44px; }
    .rsp-flow > :first-child { margin-top:0; }
    .rsp-picks-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
    .rsp-pick-card { min-width:0; }
    .rsp-pick-meta { display:flex; justify-content:space-between; gap:8px; margin-bottom:7px;
                     font-family:"Chakra Petch","Space Grotesk",sans-serif; font-size:10px;
                     font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .rsp-pick-meta span { color:var(--accent-ink); }
    .rsp-pick-meta time { color:var(--txt-3); white-space:nowrap; }
    .rsp-pick-card h3 { font-family:"Sarabun",system-ui,sans-serif; font-size:16px; line-height:1.35;
                       font-weight:800; color:var(--txt); margin:0 0 7px; }
    .rsp-pick-card p { font-family:"Sarabun",system-ui,sans-serif; font-size:12px; line-height:1.55;
                       color:var(--txt-2); margin:0; display:-webkit-box; -webkit-line-clamp:2;
                       -webkit-box-orient:vertical; overflow:hidden; }
    /* Shorts strip: scrolls in the column, not edge to edge, with the accent
       carried into the scrollbar so the rail reads as part of the design. */
    .sh-strip  { display:flex; gap:16px; overflow-x:auto; padding-bottom:14px;
                 scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
    .sh-strip::-webkit-scrollbar { height:6px; }
    .sh-strip::-webkit-scrollbar-track { background:transparent; }
    .sh-strip::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }
    .sh-strip::-webkit-scrollbar-thumb:hover { background:var(--accent-ink); }
    .sh-card   { flex:0 0 120px; }
    .rsp-hero  { display:grid; grid-template-columns:1fr 360px; gap:48px; align-items:start; }
    .rsp-hgrid { display:grid; grid-template-columns:7fr 3fr; gap:20px; }
    .rsp-ytmn  { display:grid; grid-template-columns:1.55fr 1fr; gap:28px; align-items:start; }
    .rsp-ytbt  { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:28px; }
    .rsp-tbl   { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    @media (max-width:768px) {
      .ed-tag    { font-size:10px; letter-spacing:.1em; }
      .ed-head   { padding-bottom:12px; margin-bottom:16px; }
      /* Comfortable touch targets on phones (44px guideline) */
      nav button { min-height:44px; }
      nav .nav-mob, nav button[title] { min-width:44px; }
    }
    .nav-mob   { display:none; }
    .nav-desk  { display:flex; }

    @media (max-width:1024px) {
      .rsp-wrap  { padding:0 24px; }
      .rsp-hero  { grid-template-columns:1fr 280px; gap:28px; }
      .rsp-ytmn  { grid-template-columns:1.1fr 1fr; }
      .rsp-ytbt  { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width:768px) {
      .rsp-wrap  { padding:0 16px; }
      .rsp-flow  { padding-top:28px; padding-bottom:28px; }
      .rsp-flow > * { margin-top:28px; }
      .sh-card   { flex-basis:104px; }
      .rsp-hero  { grid-template-columns:1fr; }
      .rsp-picks-grid { grid-template-columns:repeat(2,1fr); gap:22px 16px; }
      .rsp-hgrid { grid-template-columns:1fr; }
      .rsp-ytmn  { grid-template-columns:1fr; }
      .rsp-ytbt  { grid-template-columns:repeat(2,1fr); }
      .nav-mob   { display:flex !important; }
      .nav-desk  { display:none !important; }
      .nav-desk.open { display:flex !important; flex-direction:column; position:absolute; top:100%; left:0; right:0;
        background:var(--bg); border-bottom:2px solid var(--accent); z-index:200; padding:8px 0; box-shadow:0 8px 32px rgba(0,0,0,.12); }
    }
    @media (max-width:480px) {
      .rsp-picks-grid { grid-template-columns:1fr; }
      .rsp-ytbt  { grid-template-columns:1fr; }
    }
    /* ── Article view ───────────────────────────────────────────
       The single-article design from the WordPress skin. Prefixed ar- so it
       cannot collide with the archive components above. */
    .ar-prog   { position:fixed; left:0; height:3px; width:0;
                 background:var(--accent); z-index:101; transition:width .08s linear; }
    .ar-crumb  { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
                 font-family:"Chakra Petch","Space Grotesk",sans-serif; font-size:11px; font-weight:600;
                 letter-spacing:.08em; text-transform:uppercase; color:var(--txt-3); padding:18px 0 0; }
    .ar-crumb button { background:none; border:0; padding:0; cursor:pointer; font:inherit;
                 letter-spacing:inherit; text-transform:inherit; color:inherit; }
    .ar-crumb button:hover { color:var(--accent-ink); }
    .ar-crumb-now { opacity:.6; }

    /* Article column + sidebar. The sidebar sticks so the standings stay in
       reach through a long read. */
    .ar-shell  { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:56px;
                 align-items:start; padding:32px 0 64px; }
    .ar-main   { min-width:0; }
    .ar-aside  { position:sticky; top:150px; display:flex; flex-direction:column; gap:32px; min-width:0; }

    .ar-kicker { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .ar-date   { font-family:"Chakra Petch","Space Grotesk",sans-serif; font-size:10px; font-weight:700;
                 letter-spacing:.18em; text-transform:uppercase; color:var(--txt-3); }
    .ar-title  { font-family:"Noto Serif Thai",Georgia,serif; font-weight:800; font-size:44px;
                 line-height:1.25; letter-spacing:-.01em; margin:16px 0 18px; color:var(--txt); text-wrap:pretty; }
    .ar-stand  { font-size:19px; line-height:1.8; color:var(--txt-2); max-width:44em; margin:0; text-wrap:pretty; }

    .ar-byline { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:26px 0 0;
                 padding:18px 0; border-top:1px solid var(--bdr); border-bottom:1px solid var(--bdr); }
    .ar-avatar { width:40px; height:40px; border-radius:50%; flex-shrink:0;
                 background:linear-gradient(135deg,var(--accent),#ff79c6);
                 display:flex; align-items:center; justify-content:center;
                 font-weight:700; font-size:16px; color:#0d0d0d; }
    .ar-by-name{ font-family:"Chakra Petch","Space Grotesk",sans-serif; font-weight:600; font-size:13px; color:var(--txt); }
    .ar-by-meta{ font-size:12px; color:var(--txt-3); margin-top:2px; }
    .ar-share  { display:flex; gap:8px; margin-left:auto; }
    .ar-share button { width:34px; height:34px; border:1px solid var(--bdr); background:none; padding:0;
                 display:flex; align-items:center; justify-content:center; color:var(--txt-3); cursor:pointer;
                 transition:color .15s, border-color .15s; }
    .ar-share button:hover { border-color:var(--accent); color:var(--accent-ink); }

    .ar-lead   { margin:28px 0; }
    .ar-lead-img { display:block; width:100%; padding-bottom:52.3%; /* house cover 1200x628 */ background-size:cover; background-position:center; }
    .ar-lead figcaption, .ar-body figcaption { font-size:12px; color:var(--txt-3); line-height:1.6; margin-top:10px; }

    .ar-body   { max-width:44em; }
    .ar-body p { font-size:17px; line-height:1.95; margin:0 0 26px; color:var(--txt); text-wrap:pretty; }
    /* The section-heading bar: 12px CI rule, tinted ground. The contents card's
       own heading is excluded — it is chrome, not prose, and was inheriting the
       bar plus a 44px top margin inside the card. */
    .ar-body h2:not(.ar-toc-head) { font-family:"Noto Serif Thai",Georgia,serif; font-weight:700; font-size:26px; line-height:1.4;
                 margin:44px 0 18px; color:var(--txt); scroll-margin-top:140px;
                 border-left:12px solid var(--accent); background:var(--bg-alt); padding:10px 14px; }
    .ar-body blockquote { margin:36px 0; padding:0 0 0 26px; border-left:4px solid var(--accent); }
    .ar-body blockquote p { font-family:"Noto Serif Thai",Georgia,serif; font-size:22px; line-height:1.6;
                 font-weight:600; margin:0 0 12px; }
    .ar-body blockquote cite { font-style:normal; font-family:"Chakra Petch","Space Grotesk",sans-serif;
                 font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--txt-3); }

    /* Contents card — sits after the opening paragraph, so the article still
       opens in the writer's own words. */
    .ar-toc    { background:var(--bg-card); box-shadow:var(--sh-2); padding:20px 22px; margin:34px 0; }
    .ar-toc-head { font-family:"Chakra Petch","Space Grotesk",sans-serif; font-weight:700; font-size:20px;
                 line-height:1.3; margin:0; color:var(--txt); }
    .ar-toc-head::after { content:""; display:block; height:6px; background:var(--accent); margin-top:8px; }
    .ar-toc ul { list-style:disc; padding-left:22px; margin:16px 0 0; }
    .ar-toc li { margin:8px 0; font-size:16px; line-height:1.6; }
    .ar-toc li::marker { color:var(--accent); }
    .ar-toc a  { color:var(--txt-2); text-decoration:none; }
    .ar-toc a:hover { color:var(--accent-ink); }

    .ar-tags   { display:flex; flex-wrap:wrap; gap:8px; margin:34px 0 0; }
    .ar-tags span { border:1px solid var(--bdr); padding:6px 12px;
                 font-family:"Chakra Petch","Space Grotesk",sans-serif; font-size:11px; font-weight:600;
                 letter-spacing:.06em; text-transform:uppercase; color:var(--txt-2); }

    .ar-authorbox { display:flex; gap:16px; align-items:flex-start; background:var(--bg-alt);
                 padding:22px; margin:36px 0 0; }
    .ar-authorbox p { font-size:13px; line-height:1.75; color:var(--txt-2); margin:6px 0 0; }

    /* Sidebar blocks */
    .ar-blockhead { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    .ar-blockhead i { width:4px; height:18px; background:var(--accent); display:block; }
    .ar-blockhead span { font-family:"Chakra Petch","Space Grotesk",sans-serif; font-size:10px; font-weight:700;
                 letter-spacing:.18em; text-transform:uppercase; color:var(--txt-3); }
    .ar-mini   { display:grid; grid-template-columns:84px 1fr; gap:12px; padding-bottom:14px;
                 margin-bottom:14px; border-bottom:1px solid var(--bdr-2); cursor:pointer; }
    .ar-mini:last-child { border-bottom:none; padding-bottom:0; margin-bottom:0; }
    .ar-mini-img { display:block; width:100%; padding-bottom:56%; background-size:cover; background-position:center; }
    .ar-mini-title { display:block; font-weight:700; font-size:13px; line-height:1.45; margin:5px 0 3px;
                 color:var(--txt); text-wrap:pretty; }
    .ar-mini:hover .ar-mini-title { color:var(--accent-ink); }

     waiting for the Babel/React scripts below to load and transform. -->
<div id="tsd-gate">
  <div id="tsd-gate-logo"><img src="uploads/logo-sport-lockup.png" alt="THE STANDARD SPORT"></div>
  <p>หน้านี้จำกัดการเข้าถึงเฉพาะอีเมล @thestandard.co<br>กรุณาเข้าสู่ระบบด้วย Google เพื่อดูเนื้อหา</p>
  <div id="tsd-gate-btn"></div>
  <p id="tsd-gate-err"></p>
</div>
<button id="tsd-logout" onclick="tsdLogout()">ออกจากระบบ</button>

<script>
(function () {
  var CLIENT_ID = '854069548103-d459etq30iidinjm5u0pcj0p746o3q9h.apps.googleusercontent.com';
  var ALLOWED_HD = 'thestandard.co';

  function b64urlToBytes(b64url) {
    var b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
    b64 += '='.repeat((4 - (b64.length % 4)) % 4);
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function b64urlToJson(b64url) {
    return JSON.parse(new TextDecoder().decode(b64urlToBytes(b64url)));
  }

  // Verifies the id_token's RS256 signature against Google's own public
  // keys (no secret involved — this is exactly what a server would check,
  // just run in the browser with Web Crypto instead). This stops a forged
  // token from being accepted; it does NOT stop someone with devtools
  // access from just deleting the gate outright — no purely client-side
  // check can, since the real page is already sitting in their browser.
  // Good enough to keep the site out of casual/search-engine reach; not a
  // substitute for real server-side auth if this ever holds sensitive data.
  async function verifyGoogleIdToken(idToken) {
    var parts = idToken.split('.');
    if (parts.length !== 3) throw new Error('malformed token');
    var header = b64urlToJson(parts[0]);
    var payload = b64urlToJson(parts[1]);

    var jwks = await fetch('https://www.googleapis.com/oauth2/v3/certs').then(function (r) { return r.json(); });
    var jwk = jwks.keys.find(function (k) { return k.kid === header.kid; });
    if (!jwk) throw new Error('unknown signing key');

    var key = await crypto.subtle.importKey(
      'jwk', jwk, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['verify']
    );
    var data = new TextEncoder().encode(parts[0] + '.' + parts[1]);
    var sig = b64urlToBytes(parts[2]);
    var valid = await crypto.subtle.verify('RSASSA-PKCS1-v1_5', key, sig, data);
    if (!valid) throw new Error('bad signature');

    var now = Math.floor(Date.now() / 1000);
    if (payload.exp < now) throw new Error('expired');
    if (payload.aud !== CLIENT_ID) throw new Error('wrong audience');
    if (payload.iss !== 'https://accounts.google.com' && payload.iss !== 'accounts.google.com') {
      throw new Error('wrong issuer');
    }
    return payload;
  }

  function showError(msg) {
    var el = document.getElementById('tsd-gate-err');
    el.textContent = msg;
    el.style.display = 'block';
  }

  window.tsdHandleCredential = async function (response) {
    document.getElementById('tsd-gate-err').style.display = 'none';
    try {
      var payload = await verifyGoogleIdToken(response.credential);
      var email = typeof payload.email === 'string' ? payload.email : '';
      var domainOk = payload.email_verified === true &&
        (payload.hd === ALLOWED_HD || email.toLowerCase().endsWith('@' + ALLOWED_HD));
      if (!domainOk) {
        showError('เข้าถึงได้เฉพาะอีเมล @' + ALLOWED_HD + ' เท่านั้น (บัญชีนี้คือ ' + (email || 'ไม่ทราบ') + ')');
        return;
      }
      localStorage.setItem('tsdGate', JSON.stringify({
        email: email,
        exp: Date.now() + 7 * 24 * 60 * 60 * 1000,
      }));
      document.documentElement.classList.remove('tsd-locked');
    } catch (e) {
      showError('ยืนยันตัวตนกับ Google ไม่สำเร็จ กรุณาลองใหม่');
    }
  };

  window.tsdLogout = function () {
    localStorage.removeItem('tsdGate');
    location.reload();
  };

  (function initButton() {
    if (!window.google || !google.accounts || !google.accounts.id) {
      setTimeout(initButton, 150); // gsi/client loads with async/defer
      return;
    }
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: window.tsdHandleCredential,
      hd: ALLOWED_HD, // UI hint only — pre-filters the account chooser
    });
    google.accounts.id.renderButton(document.getElementById('tsd-gate-btn'), {
      theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill',
    });
  })();
})();
</script>

<script type="text/babel">
const __TW = `.twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:272px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.88);color:#29261b;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}

select.twk-field{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;padding-right:22px}

function useTweaks(d) {
  const [v, sv] = React.useState(d);
  const set = React.useCallback((k, val) => {
    const e = typeof k === 'object' ? k : { [k]: val };
    sv(p => ({ ...p, ...e }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: e }, '*');
  }, []);
  return [v, set];
}
function TweaksPanel({ title='Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const off = React.useRef({ x: 16, y: 16 });
  React.useEffect(() => {
    const h = e => { if (e?.data?.type === '__activate_edit_mode') setOpen(true); else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false); };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const drag = e => {
    const p = ref.current; if (!p) return;
    const r = p.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const mv = ev => { off.current = { x: sr-(ev.clientX-sx), y: sb-(ev.clientY-sy) }; p.style.right = off.current.x+'px'; p.style.bottom = off.current.y+'px'; };
    const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (<><style>{__TW}</style><div ref={ref} className="twk-panel" style={{ right: off.current.x, bottom: off.current.y }}><div className="twk-hd" onMouseDown={drag}><b>{title}</b><button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>✕</button></div><div className="twk-body">{children}</div></div></>);
}
function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, children }) { return <div className="twk-row"><div className="twk-lbl"><span>{label}</span></div>{children}</div>; }
function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (<TweakRow label={label}><div className="twk-seg"><div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx}*(100% - 4px)/${n})`, width:`calc((100% - 4px)/${n})` }}/>{opts.map(o => <button key={o.value} onClick={() => onChange(o.value)}>{o.label}</button>)}</div></TweakRow>);
}
function TweakSelect({ label, value, options, onChange }) {
  return (<TweakRow label={label}><select className="twk-field" value={value} onChange={e=>onChange(e.target.value)}>{options.map(o=>{ const v=typeof o==='object'?o.value:o; const l=typeof o==='object'?o.label:o; return <option key={v} value={v}>{l}</option>; })}</select></TweakRow>);
}
Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakSelect });
</script>

// ── Components ────────────────────────────────────────────────────────────────
// Official THE STANDARD SPORT lockup (supplied artwork, transparent PNG).
// White wordmark — only place it on dark surfaces.
function LogoLockup({ height = 46 }) {
  return (
    <img src="uploads/logo-sport-lockup.png" alt="THE STANDARD SPORT"
      style={{ height, width:"auto", display:"block", userSelect:"none" }} />
  );
}
// Editorial section header — red label left, boxed tag right (Dribbble-style archive layout)
function SectionHead({ label, tag, action, actionHref }) {
  const act = action && (actionHref
    ? <a href={actionHref} target="_blank" rel="noopener noreferrer" className="ed-head-all">{action} →</a>
    : <span className="ed-head-all" style={{ cursor:"pointer" }}>{action} →</span>);
  return (
    <div className="ed-head">
      <span className="ed-label">{label}</span>
      <span style={{ display:"flex", alignItems:"center", gap:12 }}>
        {act}
        {tag && <span className="ed-tag">{tag}</span>}
      </span>
    </div>
  );
}
// One chip everywhere: CI pink with dark text. The black variant this used to
// carry read as a different kind of label rather than the same one.
// The frame takes the picture's own shape instead of a fixed ratio. Fixed
// frames looked tidy but trimmed ~10% off the house 1200x628 cover; these
// backgrounds carry their dimensions in the URL, so read them from there.
function coverRatio(bg, fallback) {
  const w = /[?&]w=(\d+)/.exec(bg || ""), h = /[?&]h=(\d+)/.exec(bg || "");
  if (!w || !h) { return (fallback || 56) + "%"; }
  return (Math.round((+h[1] / +w[1]) * 1000) / 10) + "%";
}

function CatTag({ label, hot }) {
  return <span style={{ display:"inline-block", padding:"2px 9px", background:"#ffa5f7", color:"#0d0d0d", fontFamily:"Chakra Petch,Space Grotesk,sans-serif", fontWeight:700, fontSize:10, letterSpacing:"0.13em", textTransform:"uppercase" }}>{label}</span>;
}

// ── Navbar ────────────────────────────────────────────────────────────────────
function Navbar({ font, dark, onToggleDark, onNavigate }) {
  const [active, setActive] = useState("Home");
  const [menuOpen, setMenuOpen] = useState(false);
  const ff = font==="serif"?"Noto Serif Thai,serif":"Sarabun,sans-serif";
  const items = ["Home","F1","FOOTBALL","VOLLEYBALL","GOLF","AROUND ESPORTS","TENNIS"];
  // Clicking a menu item moves the CI underline and sends the reader back to the
  // top of the archive. Category landing pages are not built yet, so every item
  // currently lands on the same page — the hook is here for when they are.
  const go = (item) => {
    setActive(item);
    setMenuOpen(false);
    if (onNavigate) onNavigate(item);
  };
  const HamIcon = () => menuOpen
    ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>;
  return (
    <nav style={{ position:"sticky", top:0, zIndex:100, background:"#0d0d0d", borderBottom:"1px solid rgba(255,255,255,.1)", boxShadow:"0 2px 10px rgba(0,0,0,.35)" }}>
      {/* Top row */}
      <div style={{ position:"relative", display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 32px", minHeight:76 }}>
        {/* Hamburger — mobile only */}
        <button className="nav-mob" onClick={()=>setMenuOpen(o=>!o)}
          style={{ background:"none", border:"1px solid rgba(255,255,255,.22)", padding:"8px 10px", color:"rgba(255,255,255,.8)", display:"none", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
          <HamIcon />
        </button>
        {/* Logo — absolutely centered, and a home link */}
        <button type="button" onClick={()=>go("Home")} aria-label="Home"
          style={{ position:"absolute", left:"50%", transform:"translateX(-50%)", background:"none", border:0, padding:0, cursor:"pointer", lineHeight:0 }}>
          <LogoLockup height={52} />
        </button>
        {/* Actions — theme toggle only, matching the WordPress masthead (no search). */}
        <div style={{ display:"flex", gap:8, flexShrink:0, marginLeft:"auto" }}>
          <button onClick={onToggleDark}
            style={{ background:"none", border:"1px solid rgba(255,255,255,.22)", padding:"7px 10px", color:"rgba(255,255,255,.8)", display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.2s" }}
            title={dark?"Light mode":"Dark mode"}>
            {dark ? <IconSun /> : <IconMoon />}
          </button>
        </div>
      </div>
      {/* Nav items row */}
      <div className={`nav-desk${menuOpen?" open":""}`}
        style={{ justifyContent:"center", borderTop:"1px solid rgba(255,255,255,.1)", background:"#0d0d0d" }}>
        {items.map(item => (
          <button key={item} onClick={()=>go(item)} style={{
            background:"none", border:"none", padding:"0 20px", height:44,
            fontFamily:"Chakra Petch,Space Grotesk,sans-serif", fontWeight:600, fontSize:14,
            letterSpacing:"0.06em", textTransform:"uppercase",
            color:active===item?"#fff":"rgba(255,255,255,.55)",
            borderBottom:`2px solid ${active===item?"#ffa5f7":"transparent"}`,
            transition:"all 0.15s", whiteSpace:"nowrap", cursor:"pointer",
          }}>{item}</button>
        ))}
      </div>
    </nav>
  );
}

function ArticleView({ font, item, onBack, onOpen }) {
  const ff = font === "serif" ? "Noto Serif Thai,serif" : "Sarabun,sans-serif";
  const [prog, setProg] = useState(0);
  const [barTop, setBarTop] = useState(0);
  const bodyRef = React.useRef(null);

  // Reading progress across the body only — a bar that counts the footer as
  // "article read" tells the reader nothing useful.
  useEffect(() => {
    const onScroll = () => {
      const nav = document.querySelector("nav");
      if (nav) { setBarTop(Math.round(nav.getBoundingClientRect().bottom)); }

      const el = bodyRef.current;
      if (!el) { return; }
      // Progress across the body only — a bar that counts the footer as
      // "article read" reaches 100% while there is still text on screen.
      const start = el.getBoundingClientRect().top + window.scrollY;
      const h = el.offsetHeight - window.innerHeight;
      const p = h > 0 ? (window.scrollY - start) / h : (window.scrollY > start ? 1 : 0);
      setProg(Math.max(0, Math.min(1, p)) * 100);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive:true });
    window.addEventListener("resize", onScroll);
    return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); };
  }, [item]);

  useEffect(() => { window.scrollTo(0, 0); }, [item]);

  const others = NEWS.filter(n => n.id !== item.id);
  const initial = (item.author || "?").trim().charAt(0);

// ── Standings + Latest News ─────────────────────────────────────────────────
// Mirrors the WordPress .tsd-scoreduo: a drawn card holding the 10-column table
// on the left, a column of headlines ("Latest News") on the right. No full-bleed
// dark band — the table sits at its own size inside the reading column.
function StandingsBand({ font, onOpen }) {
  const ff = font==="serif"?"Noto Serif Thai,serif":"Sarabun,sans-serif";
  const leagues = Object.keys(STANDINGS);
  const [tab, setTab] = useState(leagues[0]);
  const data = STANDINGS[tab];

  // Ordered by points and renumbered, the same rule the WordPress tables use.
  const rows = data.rows
    .map((r, i) => ({ ...r, _i:i }))
    .sort((a, b) => (b.pts - a.pts) || (a._i - b._i))
    .map((r, i) => ({ ...r, pos:i + 1 }));

  const cols = ["Rank", "Club", "MP", "W", "D", "L", "GF", "GA", "GD", "Pts"];
  const hasCrests = rows.some(r => r.logo);
  const rail = NEWS.slice(5, 11);

  return (
    <section>
      <div className="tsd-head">
        <span className="tsd-label">Standings</span>
      </div>
      <div className="tsd-scoreduo">
        <div className="tsd-rankcol">
          <div className="tsd-rankcard">
            <div className="tsd-tabhead">
              <h3 className="tsd-scoretitle">{data.label}</h3>
              <div className="tsd-tabs" role="tablist" aria-label="Standings">
                {leagues.map(k => (
                  <button key={k} type="button" role="tab"
                          aria-selected={tab===k ? "true" : "false"}
                          tabIndex={tab===k ? 0 : -1}
                          className={"tsd-tab" + (tab===k ? " is-active" : "")}
                          onClick={()=>setTab(k)}>
                    {STANDINGS[k].label}
                  </button>
                ))}
              </div>
            </div>
            <p className="tsd-standings-note">ตารางคะแนน</p>
            <div className="tsd-tblwrap">
              <table className="tsd-tbl is-ranked">
                <thead>
                  <tr>
                    {cols.map((c, j) => (
                      <th key={c} className={j===1 ? "is-name" : undefined}>{c}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rows.map(t => {
                    const gd = t.gf - t.ga;
                    return (
                      <tr key={t.name} className="reveal">
                        <td>{t.pos}</td>
                        <td className="tsd-tbl-name" style={{ fontFamily:ff }}>
                          <span className="tsd-cell-name">
                            {hasCrests && (t.logo
                              ? <img className="tsd-avatar-img is-square is-sm" src={t.logo} alt="" width="24" height="24" loading="lazy" decoding="async" />
                              : <span className="tsd-mono" aria-hidden="true">{t.name.trim().charAt(0)}</span>)}
                            <span>{t.name}</span>
                          </span>
                        </td>
                        <td>{t.mp}</td>
                        <td>{t.w}</td>
                        <td>{t.d}</td>
                        <td>{t.l}</td>
                        <td>{t.gf}</td>
                        <td>{t.ga}</td>
                        <td>{gd > 0 ? "+" + gd : gd}</td>
                        <td><span data-count={t.pts}>0</span></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div className="tsd-newscol">
          <div className="tsd-head">
            <span className="tsd-label">Latest News</span>
          </div>
          <div className="tsd-rail">
            {rail.map(p => (
              <a key={p.id} className="tsd-railitem tsd-reveal" href="#"
                 onClick={e=>{ e.preventDefault(); if (onOpen) onOpen(p); }}>
                <span className="tsd-rail-img" style={{ background:p.bg }}></span>
                <span className="tsd-rail-body">
                  <span className="tsd-cm-cat">{p.cat}</span>
                  <span className="tsd-rail-title">{p.title}</span>
                </span>
              </a>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

            already labelled Watch, and a second black chip read as a headline. */}
        <div style={{ position:"absolute", bottom:8, right:8, background:"rgba(0,0,0,0.82)", padding:"2px 7px", fontFamily:"Chakra Petch,Space Grotesk,sans-serif", fontSize:10, fontWeight:700, color:"#fff", letterSpacing:"0.04em" }}>{video.dur}</div>
      </div>
      <p style={{ fontFamily:"Sarabun,sans-serif", fontWeight:700, fontSize:14, lineHeight:1.45, color:"var(--txt)", margin:"0 0 5px", textWrap:"pretty" }}>{video.title}</p>
      <p style={{ fontFamily:"Chakra Petch,Space Grotesk,sans-serif", fontSize:11, color:"var(--txt-3)", margin:0 }}>{video.views} views · {video.date}</p>
    </a>
  );
}

function ShortCard({ video }) {
  const [hov, setHov] = useS2(false);
  return (
    <a href={`https://www.youtube.com/shorts/${video.id}`} target="_blank" rel="noopener noreferrer"
      className="sh-card"
      style={{ textDecoration:"none", flexShrink:0, display:"block", opacity:hov?0.88:1, transition:"opacity 0.18s, transform 0.18s", transform:hov?"translateY(-2px)":"translateY(0)" }}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>
      {/* 9:16 thumbnail. A short is a thumbnail and a title — the red SHORTS
          flag and the views gradient came off so the strip reads as one row of
          pictures, the way the WordPress .tsd-short does. */}
      <div style={{ position:"relative", width:"100%", paddingBottom:"177.7%", background:video.bg, overflow:"hidden", borderRadius:0, marginBottom:10 }}>
        <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ width:30, height:30, borderRadius:"50%", background:"rgba(0,0,0,0.6)", display:"flex", alignItems:"center", justifyContent:"center" }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
      <p style={{ fontFamily:"Sarabun,sans-serif", fontWeight:700, fontSize:13, lineHeight:1.4, color:"var(--txt)", margin:0, textWrap:"pretty" }}>{video.title}</p>
    </a>
  );
}

// The Watch and Shorts blocks used to carry their own header — a red YouTube
// bar with the channel name. Every other section on the page announces itself
// with the pink plate, so these now use the same SectionHead; the section is
// part of the paper, not a guest panel from another site.

// Shorts and Watch are two sections, not one YouTube block — same split the
// WordPress build made, so the short-form strip can sit somewhere the
// long-form grid doesn't have to follow.
function ShortsSection() {
  return (
    <section>
      <SectionHead label="Shorts" action="ดูทั้งหมด"
        actionHref="https://www.youtube.com/@thestandardsport/shorts" />
      <div className="sh-strip">
        {YT_SHORTS.map(s => <ShortCard key={s.id} video={s} />)}
      </div>
    </section>
  );
}

function YouTubeSection() {
  return (
    <section>
        <div>
          <SectionHead label="Watch" action="ดูทั้งหมด"
            actionHref="https://www.youtube.com/@thestandardsport/videos" />
          {/* 3-col + featured layout: featured big left, 3 small right */}
          <div className="rsp-ytmn">
            {/* Featured */}
            <VideoCard video={YT_VIDEOS[0]} />
            {/* Right 3-col list */}
            <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
              {YT_VIDEOS.slice(1,4).map(v => (
                <a key={v.id} href={`https://www.youtube.com/watch?v=${v.id}`} target="_blank" rel="noopener noreferrer"
                  style={{ textDecoration:"none", display:"grid", gridTemplateColumns:"120px 1fr", gap:12, alignItems:"start" }}>
                  <div style={{ position:"relative", paddingBottom:"52.33%", background:v.bg, overflow:"hidden" }}>
                    <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}><IconPlay size={28} /></div>
                    <div style={{ position:"absolute", bottom:5, right:5, background:"rgba(0,0,0,0.82)", padding:"1px 5px", fontFamily:"Chakra Petch,Space Grotesk,sans-serif", fontSize:10, fontWeight:700, color:"#fff" }}>{v.dur}</div>
                  </div>
                  <div>
                    <p style={{ fontFamily:"Sarabun,sans-serif", fontWeight:700, fontSize:13, lineHeight:1.4, color:"var(--txt)", margin:"0 0 4px", textWrap:"pretty" }}>{v.title}</p>
                    <p style={{ fontFamily:"Chakra Petch,Space Grotesk,sans-serif", fontSize:10, color:"var(--txt-3)", margin:0 }}>{v.views}K · {v.date}</p>
                  </div>
                </a>
              ))}
            </div>
          </div>
          {/* Bottom row 3 more */}
          <div className="rsp-ytbt">
            {YT_VIDEOS.slice(3,6).map(v => <VideoCard key={v.id} video={v} />)}
          </div>
        </div>
    </section>
  );
}

// ── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [t, setTweak] = window.useTweaks({ heroLayout:"full", fontStyle:"sans" });
  // null = the archive. Opening a story swaps the page for the article design
  // rather than routing, which keeps the prototype a single file.
  const [article, setArticle] = useS2(null);
  const [dark, setDark] = useS2(() => {
    try { const s=localStorage.getItem('theme'); if(s) return s==='dark'; } catch(e){}
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  });

  useE2(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch(e){}
  }, [dark]);

  // ── Motion: scroll reveal + count-up. Honours prefers-reduced-motion. ──
  useE2(() => {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const settle = el => {
      el.classList.add('in');
      if (el.dataset.count != null) el.textContent = el.dataset.count;
    };
    if (reduce || !('IntersectionObserver' in window)) {
      const paint = () => document.querySelectorAll('.reveal, [data-count]').forEach(settle);
      paint();
      const mo = new MutationObserver(paint);
      mo.observe(document.body, { childList:true, subtree:true });
      return () => mo.disconnect();
    }

    const countTo = (el, target) => {
      const dur = 900, t0 = performance.now();
      const step = now => {
        const p = Math.min((now - t0) / dur, 1);
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };

    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const el = e.target;
        io.unobserve(el);
        el.classList.add('in');
        if (el.dataset.count != null) {
          const n = parseFloat(el.dataset.count);
          isNaN(n) ? el.textContent = el.dataset.count : countTo(el, n);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });

    const seen = new WeakSet();
    const scan = () => document.querySelectorAll('.reveal, [data-count]').forEach(el => {
      if (seen.has(el)) return;
      seen.add(el);
      io.observe(el);
    });
    scan();
    const mo = new MutationObserver(scan);   // re-arm when tabs swap content in
    mo.observe(document.body, { childList:true, subtree:true });
    return () => { mo.disconnect(); io.disconnect(); };
  }, []);

  return (
    <div>
      <window.Navbar font={t.fontStyle} dark={dark} onToggleDark={()=>setDark(d=>!d)}
                     onNavigate={()=>{ setArticle(null); window.scrollTo({ top:0, behavior:"smooth" }); }} />
      {article ? (
        <window.ArticleView font={t.fontStyle} item={article}
                            onBack={()=>setArticle(null)} onOpen={setArticle} />
      ) : (
        <React.Fragment>
          {t.heroLayout==="full"
            ? <window.HeroFull font={t.fontStyle} onOpen={setArticle} />
            : <window.HeroGrid font={t.fontStyle} onOpen={setArticle} />}
          {/* Same running order the WordPress build ships with:
              picks → standings → shorts → watch, all inside one reading column. */}
          <div className="rsp-wrap rsp-flow">
            <window.StandingsBand font={t.fontStyle} onOpen={setArticle} />
            <ShortsSection />
            <YouTubeSection />
          </div>
        </React.Fragment>
      )}
      <window.Footer />
      <window.TweaksPanel title="Tweaks">
        <window.TweakSection label="Hero Layout" />
        <window.TweakRadio label="Style" value={t.heroLayout} options={["full","grid"]} onChange={v=>setTweak("heroLayout",v)} />
        <window.TweakSection label="Typography" />
        <window.TweakRadio label="Font" value={t.fontStyle} options={["sans","serif"]} onChange={v=>setTweak("fontStyle",v)} />
        <window.TweakSection label="Page" />
        <window.TweakRadio label="View" value={article ? "article" : "archive"}
                           options={["archive","article"]}
                           onChange={v=>setArticle(v === "article" ? NEWS[0] : null)} />

      </window.TweaksPanel>
    </div>
  );
}

window.ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
