<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE STANDARD SPORT</title>
  <!-- Access gate: run before anything paints, so a visitor with no
       verified session never sees a flash of the real page. Mirrors the
       same "no-flash" pattern used for dark-mode init on the WP plugin.
       (ยังฝัง inline เพราะต้องทำงานก่อน paint - ตัว logic เต็มอยู่ใน assets/tsd-gate.js) -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('tsdGate');
        var s = raw ? JSON.parse(raw) : null;
        var ok = s && typeof s.email === 'string' && s.exp > Date.now() &&
          s.email.toLowerCase().endsWith('@thestandard.co');
        if (!ok) document.documentElement.classList.add('tsd-locked');
      } catch (e) {
        document.documentElement.classList.add('tsd-locked');
      }
    })();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="icon" type="image/png" href="uploads/favicon.png">
  <link rel="apple-touch-icon" href="uploads/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Noto+Serif+Thai:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- สไตล์ที่ใช้ร่วมกับหน้าบทความ (เดิมฝังอยู่ใน <style> ของไฟล์นี้ทั้งก้อน) -->
  <link rel="stylesheet" href="assets/tsd-core.css">
  <!-- รายการเมนูบาร์ 8 ช่อง (ไฟล์ข้อมูลเดียวกันกับหน้าบทความ) -->
  <script src="assets/tsd-menu.js"></script>

  <!-- ข้อมูลจริงจาก thestandard.co: 300 บทความล่าสุด (metadata)
       เนื้อความเต็มอยู่ใน data/sport-articles.js ซึ่งหน้าบทความโหลดเอง
       รีเฟรชด้วย scripts/build_data.py -->
  <script src="data/sport-posts.js"></script>
  <!-- Generated from the real THE STANDARD SPORT YouTube channel. Refresh with scripts/fetch_youtube.py. -->
  <script src="uploads/youtube-data.js"></script>
</head>
<body>

<!-- Access gate UI + logic. Plain JS on purpose — it must run without
     waiting for the Babel/React scripts below to load and transform. -->
<div id="tsd-gate">
  <div id="tsd-gate-logo"><img src="uploads/logo-sport-lockup.png" alt="THE STANDARD SPORT"></div>
  <p>หน้านี้จำกัดการเข้าถึงเฉพาะอีเมล @thestandard.co<br>กรุณาเข้าสู่ระบบด้วย Google เพื่อดูเนื้อหา</p>
  <div id="tsd-gate-btn"></div>
  <p id="tsd-gate-err"></p>
</div>
<button id="tsd-logout" onclick="tsdLogout()">ออกจากระบบ</button>
<script src="assets/tsd-gate.js"></script>

<div id="root"></div>

<!-- ⓪ แถบเมนู: ไฟล์เดียวใช้ร่วมกับ article.html -->
<script type="text/babel" src="assets/tsd-nav.js"></script>

<!-- ① TWEAKS PANEL -->
<script type="text/babel">
const __TW = `.twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:272px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.88);color:#29261b;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
.twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
.twk-hd b{font-size:12px;font-weight:600}.twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.5);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px}
.twk-x:hover{background:rgba(0,0,0,.07)}.twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.twk-row{display:flex;flex-direction:column;gap:5px}.twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.7)}.twk-lbl>span:first-child{font-weight:500}
.twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.4);padding:10px 0 0}.twk-sect:first-child{padding-top:0}
.twk-field{appearance:none;width:100%;height:26px;padding:0 8px;border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
select.twk-field{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;padding-right:22px}
.twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
.twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s,width .15s}
.twk-seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;border-radius:6px;cursor:pointer;padding:4px 6px;line-height:1.2}`;

function useTweaks(d) {
  const [v, sv] = React.useState(d);
  const set = React.useCallback((k, val) => {
    const e = typeof k === 'object' ? k : { [k]: val };
    sv(p => ({ ...p, ...e }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: e }, '*');
  }, []);
  return [v, set];
}
function TweaksPanel({ title='Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const off = React.useRef({ x: 16, y: 16 });
  React.useEffect(() => {
    const h = e => { if (e?.data?.type === '__activate_edit_mode') setOpen(true); else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false); };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const drag = e => {
    const p = ref.current; if (!p) return;
    const r = p.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const mv = ev => { off.current = { x: sr-(ev.clientX-sx), y: sb-(ev.clientY-sy) }; p.style.right = off.current.x+'px'; p.style.bottom = off.current.y+'px'; };
    const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (<><style>{__TW}</style><div ref={ref} className="twk-panel" style={{ right: off.current.x, bottom: off.current.y }}><div className="twk-hd" onMouseDown={drag}><b>{title}</b><button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>✕</button></div><div className="twk-body">{children}</div></div></>);
}
function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, children }) { return <div className="twk-row"><div className="twk-lbl"><span>{label}</span></div>{children}</div>; }
function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (<TweakRow label={label}><div className="twk-seg"><div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx}*(100% - 4px)/${n})`, width:`calc((100% - 4px)/${n})` }}/>{opts.map(o => <button key={o.value} onClick={() => onChange(o.value)}>{o.label}</button>)}</div></TweakRow>);
}
function TweakSelect({ label, value, options, onChange }) {
  return (<TweakRow label={label}><select className="twk-field" value={value} onChange={e=>onChange(e.target.value)}>{options.map(o=>{ const v=typeof o==='object'?o.value:o; const l=typeof o==='object'?o.label:o; return <option key={v} value={v}>{l}</option>; })}</select></TweakRow>);
}
Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakSelect });
</script>

<!-- ② DATA + SECTION COMPONENTS -->
<script type="text/babel">
const { useState, useEffect } = React;

// ── Data ──────────────────────────────────────────────────────────────────────
// ข่าวทุกชิ้นมาจาก data/sport-posts.js ซึ่งสร้างจากเว็บจริง (scripts/build_data.py)
// ฟิลด์ที่หน้านี้ใช้: id, cat, date, author, bg (พื้นภาพ), title, excerpt, link, ratio
// เดิมข่าว 10 ชิ้นเขียนตายไว้ในไฟล์นี้ และไม่มีลิงก์/แท็ก/ชื่อผู้เขียนจริง
const POSTS = (typeof window !== 'undefined' && window.__TSD_POSTS__) || [];
const DATA_META = (window.__TSD_STATS__ && window.__TSD_STATS__.meta) || null;
// การ์ดทุกใบพาไปหน้าบทความของโพสต์นั้น (article.html อ่าน ?id= ตัวนี้)
const openPost = (p) => { if (p && p.id) location.href = 'article.html?id=' + p.id; };
window.tsdOpenPost = openPost;

if (!POSTS.length) {
  document.getElementById('root').innerHTML =
    '<div style="max-width:640px;margin:80px auto;padding:0 24px;font-family:Sarabun,sans-serif">' +
    '<b style="font-size:18px">ไม่พบข้อมูลข่าว</b>' +
    '<p style="margin-top:10px;line-height:1.7;color:#4a4a4a">ไฟล์ data/sport-posts.js ยังไม่ถูกสร้าง ' +
    'รัน <code>python3 scripts/build_data.py</code> ที่รากโปรเจกต์ก่อน แล้วเปิดหน้านี้ใหม่</p></div>';
}

// ── Components ────────────────────────────────────────────────────────────────
// หัวข้อบล็อก — พาดหัวใหญ่สองบรรทัด บรรทัดล่างสีชมพู CI แบบเว็บ ref
// (เดิมเป็นป้ายชมพูเล็ก ๆ ซึ่งทำให้ทุกบล็อกดูเป็นวิดเจ็ตแยกชิ้น)
function SectionHead({ line1, line2, action, actionHref }) {
  return (
    <div className="tsdx-head reveal">
      <h2>{line1}<em>{line2}</em></h2>
      {action && (actionHref
        ? <a href={actionHref} target="_blank" rel="noopener noreferrer" className="tsdx-head-note">{action} <span aria-hidden="true">→</span></a>
        : <span className="tsdx-head-note">{action} <span aria-hidden="true">→</span></span>)}
    </div>
  );
}
// One chip everywhere: CI pink with dark text. The black variant this used to
// carry read as a different kind of label rather than the same one.
// The frame takes the picture's own shape instead of a fixed ratio — ข้อมูลจริง
// ส่งสัดส่วนของภาพปกมาด้วย (p.ratio จาก media_details) จึงใช้ค่านั้นก่อน
function coverRatio(bg, fallback) {
  const w = /[?&]w=(\d+)/.exec(bg || ""), h = /[?&]h=(\d+)/.exec(bg || "");
  if (!w || !h) { return (fallback || 56) + "%"; }
  return (Math.round((+h[1] / +w[1]) * 1000) / 10) + "%";
}
const ratioOf = (n) => n.ratio || coverRatio(n.bg, 56);
// ภาพย่อ (thumb) ใช้กับช่องเล็ก ๆ อย่างรางข่าวข้าง - ประหยัดแบนด์วิดท์กว่าดึงภาพใหญ่ 1200px
const bgThumb = (n) => "url('" + (n.thumb || n.img) + "') center/cover no-repeat";

// การ์ดข่าวใบเดียวใช้ทั้งหน้า ต่างกันแค่ขนาด (xl / l / m / row) กับสัดส่วนภาพ
// กรอบภาพตรึงสัดส่วนไว้ตามขนาดการ์ด ไม่ใช้สัดส่วนจริงของรูป เพราะในกริด
// ภาพสูงต่ำไม่เท่ากันทำให้แถวเบี้ยวและอ่านยาก
const RATIO = { xl:"52.3%", l:"52.3%", m:"52.3%", row:"52.3%", wide:"52.3%" };

// แถววันที่: วันซ้าย ปีขวา คร่อมเส้นบาง — โครงเดินเรื่องแบบตารางของ ref
// ชุดดาต้าส่งวันที่มาเป็นสตริงเดียว ("19 ก.ย. 2026") จึงตัดคำท้ายออกมาเป็นปี
function MetaRow({ date }) {
  const parts = String(date || "").trim().split(/\s+/).filter(Boolean);
  const year = parts.length > 1 ? parts.pop() : "";
  return (
    <div className="tsdx-meta"><span>{parts.join(" ")}</span><span>{year}</span></div>
  );
}

function NewsCard({ post, size = "l", ratio, className = "" }) {
  if (!post) return null;
  return (
    <article className={"tsdx-card reveal is-" + size + (className ? " " + className : "")}
             onClick={()=>openPost(post)}>
      <MetaRow date={post.date} />
      <div className="tsdx-rowbody">
        <div className="tsdx-frame" style={{ paddingBottom: ratio || RATIO[size] || "52.3%" }}>
          <i style={{ background: size === "row" ? bgThumb(post) : post.bg }} />
        </div>
        <div className="tsdx-body">
          <div className="tsdx-kicker"><span>{post.cat}</span></div>
          <h3>{post.title}</h3>
        </div>
      </div>
    </article>
  );
}

// ── Hero ──────────────────────────────────────────────────────────────────────
// ภาพเต็มจอ + ชื่อหมวดตัวใหญ่สีชมพูคร่อมพาดหัวขาว (คู่สีแบบเว็บ ref)
// ข่าวไทยพาดหัวยาว จึงให้หมวดเป็นบรรทัดชมพูแทนการตัดคำในพาดหัวเอง
function Hero({ post }) {
  if (!post) return null;
  return (
    <header className="tsdx-hero">
      <div className="tsdx-hero-img" style={{ background:post.bg }} />
      <div className="tsdx-hero-scrim" />
      {/* ม่านเปิดตอนโหลด: แผ่นดำขอบชมพูเฉียงกวาดออกไปทางขวา (ตกแต่งล้วน) */}
      <span className="tsdx-hero-curtain" aria-hidden="true" />
      <div className="tsdx-hero-body">
        <div className="tsdx-hero-inner">
          <p className="tsdx-hero-cat">{post.cat}</p>
          <h1 className="tsdx-hero-title" onClick={()=>openPost(post)}>{post.title}</h1>
          <div className="tsdx-hero-meta">เรื่อง <b>{post.author}</b></div>
          <div className="tsdx-hero-actions">
            <button type="button" className="btn" onClick={()=>openPost(post)}>อ่านเรื่องนี้</button>
          </div>
        </div>
      </div>
    </header>
  );
}

// ── ข่าวเด่น: ใบใหญ่หนึ่งใบคู่กับรายการแนวนอนสามใบ ──────────────────────────
// นี่คือจังหวะ "ผสม" ของหน้า — มีใบที่ชนะสายตาชัดเจนหนึ่งใบเสมอ
// ไม่ใช่การ์ดขนาดเท่ากันสี่ใบที่มองแล้วไม่รู้ว่าอันไหนสำคัญ
function LeadBlock() {
  const lead = POSTS[1];
  const rest = POSTS.slice(2, 6);
  if (!lead) return null;
  return (
    <section>
      <SectionHead line1="ข่าว" line2="เด่น"
        action="ดูข่าวกีฬาทั้งหมด"
        actionHref={(DATA_META && DATA_META.source && DATA_META.source.categoryLink) || "https://thestandard.co/category/news/sport/"} />
      <div className="tsdx-lead">
        <NewsCard post={lead} size="xl" />
        <div className="tsdx-leadlist">
          {rest.map(p => <NewsCard key={p.id} post={p} size="row" />)}
        </div>
      </div>
    </section>
  );
}

// ── ข่าวล่าสุด: ใบแรกกินสองช่องเป็นภาพแนวนอนยาว ที่เหลือไล่เป็นกริดสามช่อง ──
function LatestGrid() {
  const items = POSTS.slice(6, 15);
  if (!items.length) return null;
  return (
    <section id="latest">
      <SectionHead line1="ข่าว" line2="ล่าสุด" action="ดูทั้งหมด"
        actionHref={(DATA_META && DATA_META.source && DATA_META.source.categoryLink) || "https://thestandard.co/category/news/sport/"} />
      <div className="tsdx-grid">
        {items.map((p, i) => (
          <NewsCard key={p.id} post={p} size="l"
            className={i === 0 ? "is-wide" : ""}
            ratio={i === 0 ? RATIO.wide : undefined} />
        ))}
      </div>
    </section>
  );
}

// ── Footer ────────────────────────────────────────────────────────────────────
// ── Social icon component ─────────────────────────────────────────────────────
const SOCIALS = [
  { label:"Facebook",  href:"https://www.facebook.com/thestandardsport",
    icon:<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 8.2h-2a1 1 0 0 0-1 1v2.3h3l-.45 3.1H12.5V22h-3.1v-7.4H7.2v-3.1h2.2V9.2A4.1 4.1 0 0 1 13.5 5h2z"/></svg> },
  { label:"Instagram", href:"https://www.instagram.com/thestandardsport",
    icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.2" cy="6.9" r="1.25" fill="currentColor" stroke="none"/></svg> },
  { label:"X",         href:"https://x.com/STANDARDsportth",
    icon:<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.4 3.4h4.2l4.1 5.6 4.7-5.6h2.3l-6 7.1 6.4 8.7h-4.2l-4.4-6-5 6H4.2l6.4-7.6z"/></svg> },
  { label:"TikTok",    href:"https://www.tiktok.com/@thestandardsport",
    icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M14.1 3.2v10.2a3.4 3.4 0 1 1-2.9-3.36"/><path d="M14.1 3.2c.35 2.5 1.95 4.1 4.6 4.35"/></svg> },
];

function SocialBtn({ s }) {
  return (
    <a className="tsdx-soc" href={s.href} target="_blank" rel="noopener noreferrer"
       title={s.label} aria-label={s.label}>{s.icon}</a>
  );
}

function Footer() {
  const meta = DATA_META;
  return (
    <footer className="tsdx-foot">
      <div className="rsp-wrap">
        <div className="tsdx-foot-top">
          <div className="tsdx-foot-logo">
            <LogoLockup height={40} />
            <p className="tx-mono" style={{ marginTop:18, lineHeight:2.2 }}>
              ข่าวกีฬาไทยและต่างประเทศ<br />ทุกวัน ตลอด 24 ชั่วโมง
            </p>
          </div>
          <div className="tsdx-foot-socials">
            {SOCIALS.map(s => <SocialBtn key={s.label} s={s} />)}
          </div>
        </div>
        <div className="tsdx-foot-bottom">
          <span>© 2026 The Standard Sport · Website Prototype</span>
          {/* บอกที่มาของข้อมูลให้ตรวจย้อนกลับได้ */}
          {meta && (

// ── App ─────────────────────────────────────────────────────────────────────
function App() {
  // ผืนดำคือค่าเริ่มต้นของดีไซน์นี้ โหมดกระดาษเป็นทางเลือก ไม่ใช่ฐาน
  const [dark, setDark] = useS2(() => {
    try { return localStorage.getItem('theme') !== 'light'; } catch(e){ return true; }
  });

  useE2(() => {
    document.documentElement.setAttribute('data-theme', dark ? '' : 'light');
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch(e){}
  }, [dark]);

  // ── Motion: scroll reveal + count-up. Honours prefers-reduced-motion. ──
  useE2(() => {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const settle = el => el.classList.add('in');
    if (reduce || !('IntersectionObserver' in window)) {
      const paint = () => document.querySelectorAll('.reveal').forEach(settle);
      paint();
      const mo = new MutationObserver(paint);
      mo.observe(document.body, { childList:true, subtree:true });
      return () => mo.disconnect();
    }

    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        io.unobserve(e.target);
        settle(e.target);
      });
    }, { threshold: 0, rootMargin: '0px 0px -5% 0px' });

    const seen = new WeakSet();
    const scan = () => document.querySelectorAll('.reveal').forEach(el => {
      if (seen.has(el)) return;
      seen.add(el);
      io.observe(el);
    });
    scan();
    // กวาดซ้ำตอนเลื่อน: ถ้าผู้ใช้กระโดดข้ามทีเดียวหลายจอ (ลากสกรอลล์บาร์,
    // กดลิงก์ยึดตำแหน่ง, เบราว์เซอร์คืนตำแหน่งเดิม) IntersectionObserver
    // อาจไม่ทันเห็นบล็อกที่ผ่านไป แล้วบล็อกนั้นจะค้างจางหายทั้งก้อน
    const sweep = () => document.querySelectorAll('.reveal:not(.in)')
      .forEach(el => { if (el.getBoundingClientRect().top < window.innerHeight) settle(el); });
    window.addEventListener('scroll', sweep, { passive:true });
    const mo = new MutationObserver(scan);
    mo.observe(document.body, { childList:true, subtree:true });
    return () => { mo.disconnect(); io.disconnect(); window.removeEventListener('scroll', sweep); };
  }, []);

  // จังหวะของหน้า: ภาพเต็มจอ → ข่าวเด่น → ข่าวล่าสุด → คลิปสั้น → วิดีโอ
  return (
    <div>
      <window.Navbar dark={dark} onToggleDark={()=>setDark(d=>!d)} />
      <window.Hero post={POSTS[0]} />
      <div className="rsp-wrap rsp-flow">
        <window.LeadBlock />
        <window.LatestGrid />
        <ShortsSection />
        <YouTubeSection />
      </div>
      <window.Footer />
    </div>
  );
}
