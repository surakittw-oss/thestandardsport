  <script>
    (function () {
      try {
        var raw = localStorage.getItem('tsdGate');
        var s = raw ? JSON.parse(raw) : null;

          s.email.toLowerCase().endsWith('@thestandard.co');

<script type="text/babel">
const __TW = `.twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:272px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.88);color:#29261b;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
.twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
.twk-hd b{font-size:12px;font-weight:600}.twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.5);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px}
.twk-x:hover{background:rgba(0,0,0,.07)}.twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.twk-row{display:flex;flex-direction:column;gap:5px}.twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.7)}.twk-lbl>span:first-child{font-weight:500}
.twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.4);padding:10px 0 0}.twk-sect:first-child{padding-top:0}
.twk-field{appearance:none;width:100%;height:26px;padding:0 8px;border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
select.twk-field{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;padding-right:22px}
.twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
.twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s,width .15s}
.twk-seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;border-radius:6px;cursor:pointer;padding:4px 6px;line-height:1.2}`;

function useTweaks(d) {
  const [v, sv] = React.useState(d);
  const set = React.useCallback((k, val) => {
    const e = typeof k === 'object' ? k : { [k]: val };
    sv(p => ({ ...p, ...e }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: e }, '*');
  }, []);
  return [v, set];
}
function TweaksPanel({ title='Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const off = React.useRef({ x: 16, y: 16 });
  React.useEffect(() => {
    const h = e => { if (e?.data?.type === '__activate_edit_mode') setOpen(true); else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false); };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const drag = e => {
    const p = ref.current; if (!p) return;
    const r = p.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const mv = ev => { off.current = { x: sr-(ev.clientX-sx), y: sb-(ev.clientY-sy) }; p.style.right = off.current.x+'px'; p.style.bottom = off.current.y+'px'; };
    const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (<><style>{__TW}</style><div ref={ref} className="twk-panel" style={{ right: off.current.x, bottom: off.current.y }}><div className="twk-hd" onMouseDown={drag}><b>{title}</b><button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>✕</button></div><div className="twk-body">{children}</div></div></>);
}
function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, children }) { return <div className="twk-row"><div className="twk-lbl"><span>{label}</span></div>{children}</div>; }
function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (<TweakRow label={label}><div className="twk-seg"><div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx}*(100% - 4px)/${n})`, width:`calc((100% - 4px)/${n})` }}/>{opts.map(o => <button key={o.value} onClick={() => onChange(o.value)}>{o.label}</button>)}</div></TweakRow>);
}
function TweakSelect({ label, value, options, onChange }) {
  return (<TweakRow label={label}><select className="twk-field" value={value} onChange={e=>onChange(e.target.value)}>{options.map(o=>{ const v=typeof o==='object'?o.value:o; const l=typeof o==='object'?o.label:o; return <option key={v} value={v}>{l}</option>; })}</select></TweakRow>);
}
Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakSelect });
</script>

// ── Components ────────────────────────────────────────────────────────────────
// Official THE STANDARD SPORT lockup (supplied artwork, transparent PNG).
// White wordmark — only place it on dark surfaces.
function LogoLockup({ height = 46 }) {
  return (
    <img src="uploads/logo-sport-lockup.png" alt="THE STANDARD SPORT"
      style={{ height, width:"auto", display:"block", userSelect:"none" }} />

// หัวข้อบล็อก — พาดหัวใหญ่สองบรรทัด บรรทัดล่างสีชมพู CI แบบเว็บ ref
// (เดิมเป็นป้ายชมพูเล็ก ๆ ซึ่งทำให้ทุกบล็อกดูเป็นวิดเจ็ตแยกชิ้น)
function SectionHead({ line1, line2, action, actionHref }) {
  return (
    <div className="tsdx-head">
      <h2>{line1}<em>{line2}</em></h2>
      {action && (actionHref
        ? <a href={actionHref} target="_blank" rel="noopener noreferrer" className="tsdx-head-note">{action} <span aria-hidden="true">→</span></a>
        : <span className="tsdx-head-note">{action} <span aria-hidden="true">→</span></span>)}
    </div>
  );
}
// One chip everywhere: CI pink with dark text. The black variant this used to
// carry read as a different kind of label rather than the same one.
// The frame takes the picture's own shape instead of a fixed ratio — ข้อมูลจริง
// ส่งสัดส่วนของภาพปกมาด้วย (p.ratio จาก media_details) จึงใช้ค่านั้นก่อน
function coverRatio(bg, fallback) {
  const w = /[?&]w=(\d+)/.exec(bg || ""), h = /[?&]h=(\d+)/.exec(bg || "");
  if (!w || !h) { return (fallback || 56) + "%"; }
  return (Math.round((+h[1] / +w[1]) * 1000) / 10) + "%";
}
const ratioOf = (n) => n.ratio || coverRatio(n.bg, 56);
// ภาพย่อ (thumb) ใช้กับช่องเล็ก ๆ อย่างรางข่าวข้าง - ประหยัดแบนด์วิดท์กว่าดึงภาพใหญ่ 1200px
const bgThumb = (n) => "url('" + (n.thumb || n.img) + "') center/cover no-repeat";

// การ์ดข่าวใบเดียวใช้ทั้งหน้า ต่างกันแค่ขนาด (xl / l / m / row) กับสัดส่วนภาพ
// กรอบภาพตรึงสัดส่วนไว้ตามขนาดการ์ด ไม่ใช้สัดส่วนจริงของรูป เพราะในกริด
// ภาพสูงต่ำไม่เท่ากันทำให้แถวเบี้ยวและอ่านยาก
const RATIO = { xl:"52.3%", l:"52.3%", m:"52.3%", row:"52.3%", wide:"52.3%" };

// แถววันที่: วันซ้าย ปีขวา คร่อมเส้นบาง — โครงเดินเรื่องแบบตารางของ ref
// ชุดดาต้าส่งวันที่มาเป็นสตริงเดียว ("19 ก.ย. 2026") จึงตัดคำท้ายออกมาเป็นปี
function MetaRow({ date }) {
  const parts = String(date || "").trim().split(/\s+/).filter(Boolean);
  const year = parts.length > 1 ? parts.pop() : "";
  return (
    <div className="tsdx-meta"><span>{parts.join(" ")}</span><span>{year}</span></div>
  );
}

function NewsCard({ post, size = "l", ratio, lede = true, className = "" }) {
  if (!post) return null;
  return (
    <article className={"tsdx-card is-" + size + (className ? " " + className : "")}
             onClick={()=>openPost(post)}>
      <MetaRow date={post.date} />
      <div className="tsdx-rowbody">
        <div className="tsdx-frame" style={{ paddingBottom: ratio || RATIO[size] || "52.3%" }}>
          <i style={{ background: size === "row" ? bgThumb(post) : post.bg }} />
        </div>
        <div className="tsdx-body">
          <div className="tsdx-kicker"><span>{post.cat}</span></div>
          <h3>{post.title}</h3>
          {lede && post.excerpt && post.excerpt.length > 20 && <p>{post.excerpt}</p>}
        </div>
      </div>
    </article>
  );
}

// ── Navbar ────────────────────────────────────────────────────────────────────
// เมนู 8 ช่องตาม IA ใหม่ + ปุ่มถาวร "Fixtures & Results" ชิดขวา
// รายการเมนูอยู่ใน assets/tsd-menu.js (ที่เดียว ใช้ร่วมกับหน้าบทความ)
// ช่องที่มีรายการย่อย: เดสก์ท็อป hover/โฟกัสเพื่อเปิด, จอเล็กแตะเพื่อกางแบบแอกคอร์เดียน
// ช่องที่ไม่มีรายการย่อย (Volleyball): กดแล้วเข้าหน้ารวมของหมวดนั้นทันที
const CAN_HOVER = typeof window !== 'undefined' && !!window.matchMedia && window.matchMedia('(hover: hover)').matches;

// useHover: เปิดด้วยการชี้เมาส์เฉพาะตอนเป็นเมนูแถวเดียวเท่านั้น
// ในแผงแบบแอกคอร์เดียน ถ้ายังเปิดด้วย hover อยู่ การคลิกจะกลายเป็นการ "ปิด"
// สิ่งที่ hover เพิ่งเปิดไป เมนูย่อยจึงไม่มีทางกางบนเครื่องที่มีทั้งจอสัมผัสและเมาส์
function NavItem({ item, openKey, setOpenKey, useHover }) {
  const hasPanel = !!(item.items && item.items.length);
  const isOpen = hasPanel && openKey === item.key;
  const closeIfOutside = (e) => {
    if (!e.currentTarget.contains(e.relatedTarget)) setOpenKey(null);
  };
  return (
    <div className={"nav-dd" + (isOpen ? " open" : "")}
      onMouseEnter={useHover && hasPanel ? () => setOpenKey(item.key) : undefined}
      onMouseLeave={useHover && hasPanel ? () => setOpenKey(null) : undefined}
      onBlur={hasPanel ? closeIfOutside : undefined}>
      <a className="nav-dd-top" href={item.href || "index.html"}
        aria-haspopup={hasPanel ? "true" : undefined}
        aria-expanded={hasPanel ? (isOpen ? "true" : "false") : undefined}
        onFocus={useHover && hasPanel ? () => setOpenKey(item.key) : undefined}
        onClick={hasPanel ? (e) => { e.preventDefault(); setOpenKey(k => k === item.key ? null : item.key); } : undefined}>
        {item.live && <span className="nav-live-dot" aria-hidden="true" />}
        <span>{item.label}</span>
        {/* ลูกศรบอกว่าช่องนี้กางรายการย่อยได้ */}
        {hasPanel && <span className="nav-caret" aria-hidden="true">▾</span>}
      </a>
      {hasPanel && (
        <div className="nav-dd-panel">
          {item.panelNote && <div className="nav-dd-note">{item.panelNote}</div>}
          {item.items.map((it, i) => it.divider
            ? <div key={"sep" + i} className="nav-dd-sep" aria-hidden="true" />
            : (
              <a key={it.label} className={"nav-dd-link" + (it.tool ? " is-tool" : "")} href={it.href || "index.html"}>
                <span>{it.label}</span>
                {it.note && <span className="nav-dd-tag">{it.note}</span>}
              </a>
            ))}
        </div>
      )}
    </div>
  );
}

function Navbar({ dark, onToggleDark }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const [openKey, setOpenKey] = useState(null);
  const MENU = (typeof window !== 'undefined' && window.__TSD_MENU__) || [];
  const CTA = (typeof window !== 'undefined' && window.__TSD_MENU_CTA__) || null;
  // Escape ปิดทั้งดรอปดาวน์และแผงมือถือ
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") { setOpenKey(null); setMenuOpen(false); } };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  const HamIcon = () => menuOpen
    ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>;
  // แถบโปร่งบนภาพ hero แล้วทึบเมื่อเลื่อนพ้น — จังหวะเดียวกับเว็บ ref
  const [stuck, setStuck] = useState(false);
  useEffect(() => {
    const onScroll = () => setStuck(window.scrollY > 40);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive:true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  // แผงเมนูเต็มจอบนมือถือไม่ควรให้หน้าหลังเลื่อนตาม
  useEffect(() => {
    document.body.style.overflow = menuOpen ? "hidden" : "";
    return () => { document.body.style.overflow = ""; };
  }, [menuOpen]);

  return (
    <nav className={"tsdx-nav" + (stuck || menuOpen ? " is-stuck" : "")}>
      <div className="tsdx-navrow">
        <button className="nav-mob tsdx-iconbtn" onClick={()=>setMenuOpen(o=>!o)} aria-label="เมนู"
          aria-expanded={menuOpen ? "true" : "false"}>
          <HamIcon />
        </button>
        <a className="tsdx-navlogo" href="index.html" aria-label="Home"><LogoLockup height={26} /></a>
        {/* เมนู 8 ช่องอยู่ในแถวเดียวกับโลโก้ ไม่แยกเป็นแถบที่สองอีกแล้ว */}
        <div className={"nav-bar" + (menuOpen ? " open" : "")}>
          <div className="nav-items">
            {MENU.map(it => <NavItem key={it.key} item={it} openKey={openKey}
              setOpenKey={setOpenKey} useHover={CAN_HOVER && !menuOpen} />)}
          </div>
          {CTA && <a className="nav-cta" href={CTA.href}>{CTA.label} <span aria-hidden="true">→</span></a>}
        </div>
        <div className="tsdx-navtools">
          <button className="tsdx-iconbtn" onClick={onToggleDark} title={dark?"Light mode":"Dark mode"}>
            {dark ? <IconSun /> : <IconMoon />}
          </button>
        </div>
      </div>
    </nav>
  );
}

// ── Hero ──────────────────────────────────────────────────────────────────────
// ภาพเต็มจอ + ชื่อหมวดตัวใหญ่สีชมพูคร่อมพาดหัวขาว (คู่สีแบบเว็บ ref)
// ข่าวไทยพาดหัวยาว จึงให้หมวดเป็นบรรทัดชมพูแทนการตัดคำในพาดหัวเอง
function Hero({ post }) {
  if (!post) return null;
  return (
    <header className="tsdx-hero">
      <div className="tsdx-hero-img" style={{ background:post.bg }} />
      <div className="tsdx-hero-scrim" />
      <div className="tsdx-hero-body">
        <div className="tsdx-hero-inner">
          <div className="tsdx-hero-kicker">
            <span className="tx-chip">เรื่องเด่นวันนี้</span>
            <span className="tx-mono">{post.date}</span>
          </div>
          <p className="tsdx-hero-cat">{post.cat}</p>
          <h1 className="tsdx-hero-title" onClick={()=>openPost(post)}>{post.title}</h1>
          {post.excerpt && post.excerpt.length > 20 &&
            <p className="tsdx-hero-lede">{post.excerpt}</p>}
          <div className="tsdx-hero-meta">เรื่อง <b>{post.author}</b></div>
          <div className="tsdx-hero-actions">
            <button type="button" className="btn" onClick={()=>openPost(post)}>อ่านเรื่องนี้</button>

      <div className="tsdx-scroll"><i /><span>Scroll</span></div>

}

// ── ข่าวเด่น: ใบใหญ่หนึ่งใบคู่กับรายการแนวนอนสามใบ ──────────────────────────
// นี่คือจังหวะ "ผสม" ของหน้า — มีใบที่ชนะสายตาชัดเจนหนึ่งใบเสมอ
// ไม่ใช่การ์ดขนาดเท่ากันสี่ใบที่มองแล้วไม่รู้ว่าอันไหนสำคัญ
function LeadBlock() {
  const lead = POSTS[1];
  const rest = POSTS.slice(2, 6);
  if (!lead) return null;
  return (
    <section className="reveal">
      <SectionHead line1="ข่าว" line2="เด่น"
        action="ดูข่าวกีฬาทั้งหมด"
        actionHref={(DATA_META && DATA_META.source && DATA_META.source.categoryLink) || "https://thestandard.co/category/news/sport/"} />
      <div className="tsdx-lead">
        <NewsCard post={lead} size="xl" />
        <div className="tsdx-leadlist">
          {rest.map(p => <NewsCard key={p.id} post={p} size="row" />)}
        </div>
      </div>
    </section>
  );
}

// ── แถบคั่นเต็มจอ: หยิบเรื่องยาวหนึ่งเรื่องมาขยายเต็มความกว้างจอ ─────────────
// ทำหน้าที่เดียวกับแบนด์ภาพใหญ่ในเว็บ ref คือตัดจังหวะไม่ให้กริดไหลยาวจนล้า
function BreakBand({ post }) {
  if (!post) return null;
  return (
    <section className="tsdx-break reveal" onClick={()=>openPost(post)}>
      <div className="tsdx-break-img"><i style={{ background:post.bg }} /></div>
      <div className="tsdx-break-panel">
        <span className="tx-chip">{post.cat}</span>
        <h3>{post.title}</h3>
        {post.excerpt && post.excerpt.length > 20 && <p>{post.excerpt}</p>}
        <span className="btn is-ghost">อ่านต่อ <span aria-hidden="true">→</span></span>
      </div>
    </section>
  );
}

// ── ข่าวล่าสุด: ใบแรกกินสองช่องเป็นภาพแนวนอนยาว ที่เหลือไล่เป็นกริดสามช่อง ──
function LatestGrid() {
  const items = POSTS.slice(6, 15);
  if (!items.length) return null;
  return (
    <section id="latest" className="reveal">
      <SectionHead line1="ข่าว" line2="ล่าสุด" action="ดูทั้งหมด"
        actionHref={(DATA_META && DATA_META.source && DATA_META.source.categoryLink) || "https://thestandard.co/category/news/sport/"} />
      <div className="tsdx-grid">
        {items.map((p, i) => (
          <NewsCard key={p.id} post={p} size="l"
            className={i === 0 ? "is-wide" : ""}
            ratio={i === 0 ? RATIO.wide : undefined} />
        ))}
      </div>
    </section>
  );
}

// ── Standings + Latest News ─────────────────────────────────────────────────
// Mirrors the WordPress .tsd-scoreduo: a drawn card holding the 10-column table
// on the left, a column of headlines ("Latest News") on the right. No full-bleed
// dark band — the table sits at its own size inside the reading column.
function StandingsBand({ font, onOpen }) {
  const ff = font==="serif"?"Noto Serif Thai,serif":"Sarabun,sans-serif";
  const leagues = Object.keys(STANDINGS);
  const [tab, setTab] = useState(leagues[0]);
  const data = STANDINGS[tab];

  // Ordered by points and renumbered, the same rule the WordPress tables use.
  const rows = data.rows
    .map((r, i) => ({ ...r, _i:i }))
    .sort((a, b) => (b.pts - a.pts) || (a._i - b._i))
    .map((r, i) => ({ ...r, pos:i + 1 }));

  const cols = ["Rank", "Club", "MP", "W", "D", "L", "GF", "GA", "GD", "Pts"];
  const hasCrests = rows.some(r => r.logo);
  // Rail ข่าวล่าสุด: ใช้โพสต์ใหม่สุดถัดจากที่ hero (1) + picks (4) ใช้ไปแล้ว
  const rail = POSTS.slice(4, 10);

  return (
    <section>
      <SectionHead line1="ตาราง" line2="คะแนน" />
      <div className="tsd-scoreduo">
        <div className="tsd-rankcol">
          <div className="tsd-rankcard">
            <div className="tsd-tabhead">
              <h3 className="tsd-scoretitle">{data.label}</h3>
              <div className="tsd-tabs" role="tablist" aria-label="Standings">
                {leagues.map(k => (
                  <button key={k} type="button" role="tab"
                          aria-selected={tab===k ? "true" : "false"}
                          tabIndex={tab===k ? 0 : -1}
                          className={"tsd-tab" + (tab===k ? " is-active" : "")}
                          onClick={()=>setTab(k)}>
                    {STANDINGS[k].label}
                  </button>
                ))}
              </div>
            </div>
            <p className="tsd-standings-note">ตารางคะแนน (ข้อมูลตัวอย่าง ไม่ได้มาจากชุดดาต้า)</p>
            <div className="tsd-tblwrap">
              <table className="tsd-tbl is-ranked">
                <thead>
                  <tr>
                    {cols.map((c, j) => (
                      <th key={c} className={j===1 ? "is-name" : undefined}>{c}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rows.map(t => {
                    const gd = t.gf - t.ga;
                    return (
                      <tr key={t.name} className="reveal">
                        <td>{t.pos}</td>
                        <td className="tsd-tbl-name" style={{ fontFamily:ff }}>
                          <span className="tsd-cell-name">
                            {hasCrests && (t.logo
                              ? <img className="tsd-avatar-img is-square is-sm" src={t.logo} alt="" width="24" height="24" loading="lazy" decoding="async" />
                              : <span className="tsd-mono" aria-hidden="true">{t.name.trim().charAt(0)}</span>)}
                            <span>{t.name}</span>
                          </span>
                        </td>
                        <td>{t.mp}</td>
                        <td>{t.w}</td>
                        <td>{t.d}</td>
                        <td>{t.l}</td>
                        <td>{t.gf}</td>
                        <td>{t.ga}</td>
                        <td>{gd > 0 ? "+" + gd : gd}</td>
                        <td><span data-count={t.pts}>0</span></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div className="tsd-newscol">
          <div className="tsdx-head" style={{ marginBottom:24 }}>
            <h2 style={{ fontSize:"clamp(22px,2.2vw,30px)" }}>จาก<em>สนาม</em></h2>
          </div>
          <div className="tsd-rail">
            {rail.map(p => <NewsCard key={p.id} post={p} size="row" />)}
          </div>
        </div>
      </div>
    </section>
  );
}

            </p>
          </div>
          <div className="tsdx-foot-socials">
            {SOCIALS.map(s => <SocialBtn key={s.label} s={s} />)}
          </div>
        </div>
        <div className="tsdx-foot-bottom">
          <span>© 2026 The Standard Sport · Website Prototype</span>
          {/* บอกที่มาของข้อมูลให้ตรวจย้อนกลับได้ */}
          {meta && (

Object.assign(window, { Navbar, Hero, LeadBlock, BreakBand, LatestGrid, NewsCard, StandingsBand, Footer, SectionHead, LogoLockup, RATIO });

// ── App ─────────────────────────────────────────────────────────────────────
function App() {
  // ผืนดำคือค่าเริ่มต้นของดีไซน์นี้ โหมดกระดาษเป็นทางเลือก ไม่ใช่ฐาน
  const [dark, setDark] = useS2(() => {
    try { return localStorage.getItem('theme') !== 'light'; } catch(e){ return true; }
  });

  useE2(() => {
    document.documentElement.setAttribute('data-theme', dark ? '' : 'light');
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch(e){}
  }, [dark]);

  // ── Motion: scroll reveal + count-up. Honours prefers-reduced-motion. ──
  useE2(() => {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const settle = el => {
      el.classList.add('in');
      if (el.dataset.count != null && !el.dataset.counted) {
        el.dataset.counted = '1';
        el.textContent = el.dataset.count;
      }
    };
    if (reduce || !('IntersectionObserver' in window)) {
      const paint = () => document.querySelectorAll('.reveal, [data-count]').forEach(settle);
      paint();
      const mo = new MutationObserver(paint);
      mo.observe(document.body, { childList:true, subtree:true });
      return () => mo.disconnect();
    }

    const countTo = (el, target) => {
      const dur = 900, t0 = performance.now();
      const step = now => {
        const p = Math.min((now - t0) / dur, 1);
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };

    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const el = e.target;
        io.unobserve(el);
        el.classList.add('in');
        if (el.dataset.count != null && !el.dataset.counted) {
          el.dataset.counted = '1';
          const n = parseFloat(el.dataset.count);
          isNaN(n) ? el.textContent = el.dataset.count : countTo(el, n);
        }
      });
    }, { threshold: 0, rootMargin: '0px 0px -5% 0px' });

    const seen = new WeakSet();
    const scan = () => document.querySelectorAll('.reveal, [data-count]').forEach(el => {
      if (seen.has(el)) return;
      seen.add(el);
      io.observe(el);
    });
    scan();
    // กวาดซ้ำตอนเลื่อน: ถ้าผู้ใช้กระโดดข้ามทีเดียวหลายจอ (ลากสกรอลล์บาร์,
    // กดลิงก์ยึดตำแหน่ง, เบราว์เซอร์คืนตำแหน่งเดิม) IntersectionObserver
    // อาจไม่ทันเห็นบล็อกที่ผ่านไป แล้วบล็อกนั้นจะค้างจางหายทั้งก้อน
    const sweep = () => document
      .querySelectorAll('.reveal:not(.in), [data-count]:not([data-counted])')
      .forEach(el => { if (el.getBoundingClientRect().top < window.innerHeight) settle(el); });
    window.addEventListener('scroll', sweep, { passive:true });
    const mo = new MutationObserver(scan);   // re-arm when tabs swap content in
    mo.observe(document.body, { childList:true, subtree:true });
    return () => { mo.disconnect(); io.disconnect(); window.removeEventListener('scroll', sweep); };
  }, []);

  // จังหวะของหน้า: ภาพเต็มจอ → ข่าวเด่น → แถบคั่นเต็มจอ → ข่าวล่าสุด
  // → ตารางคะแนน → คลิปสั้น → วิดีโอ   สลับกริดกับภาพเต็มความกว้างไปมา
  // ไม่ให้เป็นกริดไหลยาวต่อกันหมดจนสายตาไม่มีที่พัก
  const breakPost = POSTS[15] || POSTS[6];
  return (
    <div>
      <window.Navbar dark={dark} onToggleDark={()=>setDark(d=>!d)} />
      <window.Hero post={POSTS[0]} />
      <div className="rsp-wrap rsp-flow">
        <window.LeadBlock />
      </div>
      <window.BreakBand post={breakPost} />
      <div className="rsp-wrap rsp-flow">
        <window.LatestGrid />
        <window.StandingsBand onOpen={window.tsdOpenPost} />
        <ShortsSection />
        <YouTubeSection />
      </div>
      <window.Footer />
    </div>
  );
}

window.ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
